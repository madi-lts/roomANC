name: Publish site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While the repository's Pages source is "Deploy from a branch", every
      # push also triggers a legacy "pages build and deployment" Jekyll run
      # that races this deployment; whichever finishes last is served. Wait
      # for it so the Quarto deployment is always created after it and wins.
      # Harmless once the Pages source is switched to "GitHub Actions".
      - name: Wait for the legacy Pages build to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")]')
            total=$(echo "$runs" | jq 'length')
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            echo "legacy pages runs for ${{ github.sha }}: $total total, $pending pending"
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then break; fi
            if [ "$total" -eq 0 ] && [ "$i" -ge 6 ]; then break; fi
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
